<header class="navbar">
    <nav class="container">
        <ul>
            <li><a href="/" style="text-decoration: none; color: inherit;"><strong>pyShelf</strong></a></li>
        </ul>
        <ul>
            <li>
                <form id="search-form" role="search">
                    <select id="collection-select" name="collection">
                        <option value="">Select a collection</option>
                        {% if collections %}
                            {% for col in collections %}
                                {% set col_val = col.collection if col.collection is defined else (col.name if col.name is defined else col) %}
                                <option value="{{ col_val }}">{{ col_val }}</option>
                            {% endfor %}
                        {% endif %}
                    </select>
                    <input type="search" id="search-input" name="search" placeholder="Search books...">
                    <button type="submit" id="search-btn">Search</button>
                </form>
            </li>
        </ul>
    </nav>
</header>
